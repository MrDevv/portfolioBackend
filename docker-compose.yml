services:
  db:
    container_name: db_portfolio
    image: postgres:18.3
    volumes:
      - vol_db_portfolio:/var/lib/postgresql
    ports:
      - "5433:5432"
    environment:
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    restart: always

  portfolio:
    container_name: api_portfolio
    depends_on:
      - db
    image: mrdevv24/api_portfolio:0.0.1
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
    restart: always

volumes:
  vol_db_portfolio:
    external: false

