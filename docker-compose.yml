services:
  db:
    container_name: db_devvault
    image: postgres:18.3
    volumes:
      - vol_db_devvault:/var/lib/postgresql
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      TZ: America/Lima
    restart: always

  devvault:
    container_name: api_devvault
    depends_on:
      - db
    image: ghcr.io/mrdevv/api_devvault:1.0.0
    ports:
      - "8082:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      PORT: ${PORT}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      EMAIL_USERNAME: ${EMAIL_USERNAME}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL}
      LOGO_URL: ${LOGO_URL}
      JAVA_TOOL_OPTIONS: -Duser.timezone=America/Lima
    restart: always

volumes:
  vol_db_devvault:
    external: false

